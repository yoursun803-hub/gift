<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛的禮物</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.25);
      max-width: 360px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    h1 {
      color: #ff4d6d;
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .img-container {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .img-container svg {
      width: 100%;
      height: 100%;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .img-container:hover svg {
      transform: scale(1.08);
    }
    .btn-accept {
      background-color: #ff4d6d;
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 19px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 6px 16px rgba(255, 77, 109, 0.35);
      transition: all 0.2s ease;
      display: inline-block;
    }
    .btn-accept:hover {
      background-color: #ff2a55;
      transform: translateY(-2px);
    }
    .btn-accept:active {
      transform: translateY(1px);
    }
    .hidden {
      display: none !important;
    }
    .hint {
      color: #b0b0b0;
      font-size: 14px;
      margin-top: 15px;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 第一階段：打開愛的禮物 -->
    <div id="step-1">
      <h1>請打開愛的禮物</h1>
      <div class="img-container" onclick="openGift()">
        <!-- 愛心禮物繪圖 -->
        <svg viewBox="0 0 200 200" width="200" height="200">
          <defs>
            <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#ff758f"/>
              <stop offset="100%" style="stop-color:#ff4d6d"/>
            </linearGradient>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
            </filter>
          </defs>
          <g filter="url(#shadow)">
            <!-- 禮物盒身 -->
            <rect x="35" y="75" width="130" height="95" rx="12" fill="url(#boxGrad)"/>
            <!-- 緞帶 (豎) -->
            <rect x="88" y="75" width="24" height="95" fill="#ffffff" opacity="0.9"/>
            <!-- 禮物盒蓋 -->
            <rect x="25" y="55" width="150" height="28" rx="8" fill="#ff4d6d"/>
            <rect x="88" y="55" width="24" height="28" fill="#ffffff" opacity="0.9"/>
            <!-- 蝴蝶結 -->
            <path d="M 100 55 C 65 15, 35 45, 90 55 Z" fill="#ffffff"/>
            <path d="M 100 55 C 135 15, 165 45, 110 55 Z" fill="#ffffff"/>
            <circle cx="100" cy="55" r="8" fill="#fff0f3"/>
            <!-- 中央愛心圖案 -->
            <path d="M 100 108 C 90 92, 65 102, 78 122 L 100 142 L 122 122 C 135 102, 110 92, 100 108 Z" fill="#ffffff" opacity="0.95"/>
          </g>
        </svg>
      </div>
      <p class="hint">（點擊禮物盒拆開）</p>
    </div>

    <!-- 第二階段：可愛小狗叼著千元鈔票 -->
    <div id="step-2" class="hidden">
      <h1>驚喜送達！</h1>
      <div class="img-container">
        <!-- 可愛小狗叼著 1000 元紙鈔 -->
        <svg viewBox="0 0 200 200" width="200" height="200">
          <g filter="url(#shadow)">
            <!-- 狗耳朵 -->
            <ellipse cx="50" cy="80" rx="16" ry="35" fill="#8d5524" transform="rotate(-15 50 80)"/>
            <ellipse cx="150" cy="80" rx="16" ry="35" fill="#8d5524" transform="rotate(15 150 80)"/>
            <!-- 狗頭與腮紅 -->
            <ellipse cx="100" cy="88" rx="52" ry="44" fill="#e0a96d"/>
            <circle cx="68" cy="98" r="8" fill="#ffb4a2" opacity="0.6"/>
            <circle cx="132" cy="98" r="8" fill="#ffb4a2" opacity="0.6"/>
            <!-- 嘴巴區域 -->
            <ellipse cx="100" cy="100" rx="28" ry="18" fill="#ffffff"/>
            <!-- 眼睛 -->
            <circle cx="78" cy="80" r="6" fill="#2b2b2b"/>
            <circle cx="76" cy="78" r="2" fill="#ffffff"/>
            <circle cx="122" cy="80" r="6" fill="#2b2b2b"/>
            <circle cx="120" cy="78" r="2" fill="#ffffff"/>
            <!-- 鼻子 -->
            <ellipse cx="100" cy="93" rx="7" ry="5" fill="#2b2b2b"/>

            <!-- 1000元新臺幣鈔票 -->
            <g transform="rotate(-4 100 118)">
              <!-- 鈔票底色 (藍色系) -->
              <rect x="30" y="105" width="140" height="42" rx="4" fill="#5283a0" stroke="#3a6079" stroke-width="1.5"/>
              <rect x="36" y="110" width="128" height="32" rx="2" fill="#7baac6"/>
              <!-- 鈔票圖案與文字 -->
              <circle cx="60" cy="126" r="10" fill="#a4cbdf" opacity="0.7"/>
              <text x="135" y="131" font-size="15" font-weight="900" fill="#003147" font-family="Arial, sans-serif" text-anchor="middle">1000</text>
              <text x="88" y="123" font-size="9" font-weight="bold" fill="#003147">中央銀行</text>
              <text x="88" y="133" font-size="7" fill="#003147">中華民國</text>
            </g>
          </g>
        </svg>
      </div>
      <button class="btn-accept" id="acceptBtn" onclick="acceptGift()">請接受</button>
      <div id="sendingMsg" class="status-msg hidden">發送通知中...</div>
    </div>

    <!-- 第三階段：感謝與完成畫面 -->
    <div id="step-3" class="hidden">
      <h1>感謝接受！❤️</h1>
      <p style="color: #555; font-size: 16px; margin-top: 15px; line-height: 1.6;">
        通知已成功發送囉！<br>準備收下這份心意吧～
      </p>
    </div>
  </div>

  <script>
    function openGift() {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
    }

    function acceptGift() {
      const btn = document.getElementById('acceptBtn');
      const sendingMsg = document.getElementById('sendingMsg');
      
      btn.disabled = true;
      btn.style.opacity = '0.6';
      sendingMsg.classList.remove('hidden');

      // ⚠️ 請替換為你在 Formspree 申請到的 Endpoint URL
      const formspreeUrl = 'https://formspree.io/f/YOUR_FORMSPREE_ID';

      if (formspreeUrl && !formspreeUrl.includes('YOUR_FORMSPREE_ID')) {
        fetch(formspreeUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            message: '🎉 對方已經點擊「請接受」愛的禮物囉！',
            time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
          })
        }).finally(() => {
          showStep3();
        });
      } else {
        // 若未填寫 Formspree URL，仍順暢切換至感謝頁面
        setTimeout(showStep3, 500);
      }
    }

    function showStep3() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.remove('hidden');
    }
  </script>
</body>
</html>
